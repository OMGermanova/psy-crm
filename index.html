<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Кабинет — CRM для психолога</title>
  <meta name="description" content="Простая CRM для психолога: клиенты, сессии, оплаты и ближайшие встречи в одном спокойном интерфейсе. Демонстрационная версия." />
  <meta name="theme-color" content="#5f7f6a" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235f7f6a'/><circle cx='16' cy='16' r='7.5' fill='none' stroke='white' stroke-width='2'/><path d='M16 11.5v5l3.2 1.9' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/></svg>" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Кабинет — CRM для психолога" />
  <meta property="og:description" content="Клиенты, сессии, оплаты и ближайшие встречи в одном спокойном интерфейсе. Демо-версия." />
  <meta property="og:locale" content="ru_RU" />
  <meta name="twitter:card" content="summary" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9" /><path d="M12 7v5l3.5 2" />
          </svg>
        </span>
        <div class="brand-text">
          <strong>Кабинет</strong>
          <span>CRM психолога</span>
        </div>
      </div>

      <nav class="nav" aria-label="Разделы">
        <button class="nav-item is-active" data-view="today" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="3" /><path d="M8 3v4M16 3v4M3 11h18" />
          </svg>
          <span>Сегодня</span>
        </button>
        <button class="nav-item" data-view="clients" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 19v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1" /><circle cx="9" cy="7" r="4" />
            <path d="M22 19v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" />
          </svg>
          <span>Клиенты</span>
          <span class="nav-badge" id="navClients">0</span>
        </button>
        <button class="nav-item" data-view="sessions" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8 6h13M8 12h13M8 18h13" /><circle cx="3.5" cy="6" r="1.4" /><circle cx="3.5" cy="12" r="1.4" /><circle cx="3.5" cy="18" r="1.4" />
          </svg>
          <span>Сессии</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <span class="demo-badge">Демо-версия. Данные ненастоящие и живут только в этом браузере.</span>
        <button class="link-btn" id="resetDemo" type="button">Сбросить демо-данные</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <label class="search">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.6-3.6" />
          </svg>
          <input type="search" id="search" placeholder="Найти клиента, сессию или заметку" autocomplete="off" />
        </label>
        <button class="btn btn-primary" id="newClient" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
          Новый клиент
        </button>
      </header>

      <div class="views">
        <section class="view is-active" id="view-today">
          <div class="view-head">
            <h1 id="greeting">Сегодня</h1>
            <p class="view-sub" id="todayDate"></p>
          </div>
          <div class="stats" id="stats"></div>
          <div class="panel">
            <div class="panel-head">
              <h2>Ближайшие встречи</h2>
              <button class="btn btn-soft btn-sm" id="quickSession" type="button">+ Сессия</button>
            </div>
            <div class="upcoming" id="upcoming"></div>
          </div>
        </section>

        <section class="view" id="view-clients">
          <div class="view-head">
            <h1>Клиенты</h1>
            <p class="view-sub" id="clientsSub"></p>
          </div>
          <div class="chips" id="statusFilter"></div>
          <div class="clients-grid" id="clientsGrid"></div>
        </section>

        <section class="view" id="view-sessions">
          <div class="view-head">
            <h1>Сессии</h1>
            <p class="view-sub" id="sessionsSub"></p>
          </div>
          <div class="panel">
            <div class="sessions" id="sessionsList"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <!-- Клиент: создание и редактирование -->
  <dialog class="dialog" id="clientDialog">
    <form class="dialog-form" id="clientForm">
      <h2 id="clientFormTitle">Новый клиент</h2>
      <input type="hidden" id="clientId" />

      <label class="field">
        <span>Имя *</span>
        <input id="clientName" required placeholder="Анна Петрова" autocomplete="off" />
      </label>

      <div class="row">
        <label class="field">
          <span>Телефон</span>
          <input id="clientPhone" placeholder="+7 921 000-00-00" autocomplete="off" />
        </label>
        <label class="field">
          <span>Стоимость сессии, ₽</span>
          <input id="clientPrice" type="number" min="0" step="100" placeholder="4000" />
        </label>
      </div>

      <div class="row">
        <label class="field">
          <span>E-mail</span>
          <input id="clientEmail" type="email" placeholder="anna@mail.ru" autocomplete="off" />
        </label>
        <label class="field">
          <span>Статус</span>
          <select id="clientStatus"></select>
        </label>
      </div>

      <label class="field">
        <span>Заметка</span>
        <textarea id="clientNote" rows="3" placeholder="Запрос, особенности, важное"></textarea>
      </label>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>Отмена</button>
        <button class="btn btn-primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <!-- Сессия -->
  <dialog class="dialog" id="sessionDialog">
    <form class="dialog-form" id="sessionForm">
      <h2 id="sessionFormTitle">Новая сессия</h2>
      <input type="hidden" id="sessionId" />

      <label class="field">
        <span>Клиент *</span>
        <select id="sessionClient" required></select>
      </label>

      <div class="row">
        <label class="field">
          <span>Дата *</span>
          <input id="sessionDate" type="date" required />
        </label>
        <label class="field">
          <span>Время</span>
          <input id="sessionTime" type="time" />
        </label>
      </div>

      <div class="row">
        <label class="field">
          <span>Тема</span>
          <input id="sessionTopic" placeholder="Тревожность" autocomplete="off" />
        </label>
        <label class="field">
          <span>Стоимость, ₽</span>
          <input id="sessionAmount" type="number" min="0" step="100" placeholder="4000" />
        </label>
      </div>

      <label class="field">
        <span>Заметка после сессии</span>
        <textarea id="sessionNote" rows="3" placeholder="Что обсуждали, что важно на следующий раз"></textarea>
      </label>

      <label class="check">
        <input type="checkbox" id="sessionPaid" />
        <span>Оплачено</span>
      </label>

      <div class="dialog-actions">
        <button class="btn btn-ghost" type="button" data-close>Отмена</button>
        <button class="btn btn-primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <!-- Карточка клиента -->
  <dialog class="dialog" id="cardDialog">
    <div class="dialog-form" id="cardBody"></div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
